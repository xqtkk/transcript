<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YouTube Transcript</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 40px auto; background: #f9fafb; color: #111827; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        input, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 6px; box-sizing: border-box; border: 1px solid #d1d5db; font-size: 16px; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        textarea { width: 100%; height: 300px; padding: 12px; border-radius: 6px; border: 1px solid #d1d5db; box-sizing: border-box; resize: vertical; font-size: 14px; line-height: 1.5; }
        .status { margin-bottom: 12px; font-size: 14px; font-weight: 500; }
        .error { color: #dc2626; }
        .success { color: #16a34a; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top: 0;">Получить текст видео</h2>
        <input type="text" id="url" placeholder="Вставьте ссылку на YouTube...">
        <button onclick="fetchTranscript()">Загрузить текст</button>
        <div id="status" class="status"></div>
        <textarea id="result" placeholder="Здесь появится готовый текст для копирования..." readonly></textarea>
    </div>
    
    <script>
        async function fetchTranscript() {
            const url = document.getElementById('url').value;
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            
            if (!url) return;
            
            status.textContent = "Скачивание субтитров...";
            status.className = "status";
            result.value = "";
            
            try {
                // Обращается к вашему локальному серверу Python
                const response = await fetch('https://transcript-rejr.onrender.com/api/transcript', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await response.json();
                
                if (response.ok) {
                    result.value = data.text;
                    status.textContent = "Успешно загружено!";
                    status.className = "status success";
                } else {
                    status.textContent = data.error;
                    status.className = "status error";
                }
            } catch (e) {
                status.textContent = "Ошибка. Убедитесь, что сервер Python запущен (python server.py).";
                status.className = "status error";
            }
        }
    </script>
</body>
</html>
